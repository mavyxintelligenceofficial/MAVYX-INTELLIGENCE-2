# Mavyx Intelligence — CI/CD Pipeline
# Per Volume V Chapter 7 §7.9: Continuous Integration Pipeline
# Per Volume VI §1.7: Quality Gates
#
# Triggers on push to main and pull requests.
# Runs: lint, type-check, unit tests, build validation.

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'

jobs:
  # ─── Quality Gate 1: Code Quality ─────────────────────────────────
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint
        continue-on-error: true

  # ─── Quality Gate 2: NestJS Services ──────────────────────────────
  test-services:
    name: Test Backend Services
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Authentication Service
        working-directory: services/authentication-service
        run: pnpm test
        continue-on-error: true

      - name: Test User Service
        working-directory: services/user-service
        run: pnpm test
        continue-on-error: true

      - name: Test Market Service
        working-directory: services/market-service
        run: pnpm test
        continue-on-error: true

  # ─── Quality Gate 3: AI Service ──────────────────────────────────
  test-ai:
    name: Test AI Service
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: ai/models/model-service
        run: pip install -r requirements.txt

      - name: Run AI tests
        working-directory: ai/models/model-service
        run: python -m pytest test_model_service.py -v
        continue-on-error: true

  # ─── Quality Gate 4: Build Validation ────────────────────────────
  build:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: [test-services, test-ai]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API Gateway
        working-directory: services/api-gateway
        run: pnpm build
        continue-on-error: true

      - name: Build Frontend
        working-directory: apps/web
        run: pnpm build
        continue-on-error: true
